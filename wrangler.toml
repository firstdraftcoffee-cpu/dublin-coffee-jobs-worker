name = "cv-review"
main = "worker.js"
compatibility_date = "2026-07-25"

[vars]
SITE_URL = "https://dublincoffeejobs.com"
# Where the Monday jobs email, Group paste notes and flag alerts go.
ALERT_EMAIL_TO = "firstdraftcoffee@gmail.com"
WORKER_URL = "https://cv-review.firstdraftcoffee.workers.dev"
# Where employers' replies to free-listing invites go.
INVITE_REPLY_TO = "firstdraftcoffee@gmail.com"
# Free launch: Standard posts and contact unlocks are free while this is "true".
FREE_POSTING = "true"
R2_PUBLIC_URL = "https://pub-9006ac83344649a5b76348e351676830.r2.dev"

# Runs every hour: job alerts, digest, renewal reminders, and the Monday jobs scan.
[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "FDC_STORE"
id = "b0c80912b53c4118a42af67a9ec29c34"

[[r2_buckets]]
binding = "FDC_UPLOADS"
bucket_name = "fdc-uploads"

# ANTHROPIC_API_KEY is set as a secret, not here — run:
#   npx wrangler secret put ANTHROPIC_API_KEY
